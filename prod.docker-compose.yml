services:
  tower-drop-app:
    image: ghcr.io/diegolibonati/tower-drop:latest
    restart: always
    ports:
      - "127.0.0.1:${APP_PORT:-9001}:8080"
    networks:
      - tower-drop-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  tower-drop-net: