server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Replaces X-Frame-Options: its ALLOW-FROM variant is deprecated and ignored
    # by every current browser, so an allowlist is only expressible via CSP.
    # Browsers that support frame-ancestors ignore X-Frame-Options entirely.
    # Only the portfolio may embed this game; direct visits are not framed, so
    # 'self' is intentionally left out.
    #
    # nginx does not merge add_header across levels: a block that declares any
    # add_header drops every inherited one. The headers below must therefore be
    # repeated in each location, not only here.
    add_header Content-Security-Policy "frame-ancestors https://diegolibonati.com.ar https://www.diegolibonati.com.ar" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.(?:js|css|ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
        add_header Content-Security-Policy "frame-ancestors https://diegolibonati.com.ar https://www.diegolibonati.com.ar" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Content-Security-Policy "frame-ancestors https://diegolibonati.com.ar https://www.diegolibonati.com.ar" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri /index.html;
    }
}